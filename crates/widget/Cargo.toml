[package]
name = "nse-tracker-widget"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Compact macOS desktop panel for nse-tracker"
license = "MIT"

[dependencies]
chrono = "0.4"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
nse-tracker = { path = "../.." }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", default-features = false }
